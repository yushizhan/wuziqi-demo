<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>贪吃蛇</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app">
      <h1>贪吃蛇</h1>
      <div class="scores">
        <span>得分 <strong id="score">0</strong></span>
        <span>最高分 <strong id="best">0</strong></span>
      </div>
      <div class="board">
        <canvas id="canvas" aria-label="游戏画面"></canvas>
        <div class="overlay" id="overlay" hidden></div>
      </div>
      <div class="dpad" aria-label="方向键">
        <button data-dir="up" aria-label="上">▲</button>
        <button data-dir="left" aria-label="左">◀</button>
        <button data-dir="down" aria-label="下">▼</button>
        <button data-dir="right" aria-label="右">▶</button>
      </div>
      <p class="hint">方向键 / WASD 移动 · 空格 开始/暂停 · Enter 或 R 重新开始 · 触屏可滑动</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
